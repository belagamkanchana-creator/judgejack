[project]
name = "judgejack"
version = "0.1.0"
description = "How much does an attacker need to know to fool an LLM judge? Experiments on AgentDojo."
requires-python = ">=3.12"
dependencies = ["agentdojo==0.1.35"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.setuptools]
packages = ["judgejack"]
